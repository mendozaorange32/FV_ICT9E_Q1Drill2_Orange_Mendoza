<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://wallpapers.com/images/featured/volleyball-6dvotamb3ddiy7qw.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
   <div class="container py-4">
    <div class="row text-center mb-4">
        <h1 class="text-white fw-bold display-5">A Beginner's Guide to Volleyball</h1>
    </div>

       <br>
       <div class="text-center">
           <img src="https://pngimg.com/uploads/volleyball/volleyball_PNG35.png" alt="Volleyball" id="volleyball-img" width="130" style="filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));">
       </div>
       <br>
       
       <div class="row gap-3">
          <div class="col bg-white text-dark p-4 border rounded shadow-lg">
            <h3 class="text-dark">Basic Rules</h3>
            <ul>
                <li>6 players per team</li>
                <li>Maximum 3 hits per side</li>
                <li>Rally point scoring</li>
                <li>Player rotation</li>
            </ul>
          </div>

          <div class="col bg-white text-dark p-4 border rounded shadow-lg">
            <h3 class="text-dark">Equipment</h3>
            <ul>
                <li>Volleyball</li>
                <li>Net and poles</li>
                <li>Kneepads</li>
                <li>Court Shoes</li>
            </ul>
          </div>

          <div class="col bg-white text-dark p-4 border rounded shadow-lg">
            <h3 class="text-dark">Basic Skills</h3>
            <ul>
                <li>Passing (Bump)</li>
                <li>Setting</li>
                <li>Spiking</li>
                <li>Serving</li>
            </ul>
          </div>
       </div>
   </div>
</body>
</html>
